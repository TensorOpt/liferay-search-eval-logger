##
## Liferay Workspace settings. Per-developer overrides belong in
## gradle-local.properties, which is not tracked.
##

# Must match a "releaseKey" in https://releases.liferay.com/releases.json. This
# is the single source of the DXP update level: it derives
# app.server.tomcat.version, liferay.workspace.bundle.url,
# liferay.workspace.docker.image.liferay and
# liferay.workspace.target.platform.version. Those are deliberately left unset
# here, because a pinned value overrides the derived one and then silently
# survives a change to this key.
liferay.workspace.product=dxp-7.4-u112

liferay.workspace.bundle.dist.include.metadata=true
liferay.workspace.home.dir=bundles
liferay.workspace.modules.dir=modules

# Resolves sources for the target platform artifacts so the Liferay search API
# can be read from the IDE while implementing against it.
target.platform.index.sources=true
