subprojects {
	group = "com.tensoropt.search.eval.logger"

	// Pinned to Java 8 because bnd derives the bundle's osgi.ee requirement from
	// the class file version: building on a newer JDK without this emits
	// osgi.ee=JavaSE version=11 (or later), and that bundle then fails to
	// resolve on a DXP 7.4 install running JDK 8.
	tasks.withType(JavaCompile) {
		sourceCompatibility = "1.8"
		targetCompatibility = "1.8"
	}
}
