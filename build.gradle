subprojects {
	group = "com.tensoropt.search.eval.logger"

	// Pinned to the level the target platform itself is built at. DXP 2025.Q1
	// LTS ships Java 17 bytecode, so the build JDK must be 17 or newer, and
	// there is no longer an older runtime to stay compatible with: this was 1.8
	// while the target was DXP 7.4, which supported JDK 8. bnd derives the
	// bundle's osgi.ee requirement from the class file version, so this is also
	// what the bundles advertise.
	tasks.withType(JavaCompile) {
		sourceCompatibility = "17"
		targetCompatibility = "17"
	}
}

// Unit tests run on plain JUnit against the module's own logic. Nothing here
// starts a portal: anything that would need one is covered by the empirical
// checks in DESIGN.md section 7 instead, deliberately, because a mocked portal
// proves only that the mock matches the assumption being tested.
//
// Wired inside plugins.withId because the Liferay workspace plugin applies the
// java plugin to each module after this block is evaluated, so the test
// configurations do not exist yet at this point.
subprojects {
	plugins.withId("java") {
		repositories {
			mavenCentral()
		}

		dependencies {
			testImplementation group: "org.junit.jupiter", name: "junit-jupiter", version: "5.10.2"
			testImplementation group: "org.mockito", name: "mockito-core", version: "5.11.0"
			testRuntimeOnly group: "org.junit.platform", name: "junit-platform-launcher", version: "1.10.2"
		}

		tasks.withType(Test) {
			useJUnitPlatform()

			// Petra's StringBundler reaches for MethodHandles.Lookup.IMPL_LOOKUP
			// in a static initializer, so any test that touches a class using it
			// dies on JDK 17 with InaccessibleObjectException before reaching an
			// assertion. The portal's own launcher passes the same open; the
			// tests need it for the same reason.
			jvmArgs "--add-opens=java.base/java.lang.invoke=ALL-UNNAMED"

			testLogging {
				events "failed"
				exceptionFormat "full"
			}
		}
	}
}
