#
# MySQL 8.4 reached with the MariaDB driver the DXP image ships, which needs
# no Connector/J download and streams result sets without a URL flag.

services:

  database:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: lportal
      MYSQL_USER: lportal
      MYSQL_PASSWORD: lportal
      MYSQL_ROOT_PASSWORD: root
    command: ["--max-connections=200"]
    ports:
      - "${SEL_E2E_BIND:-127.0.0.1}:${SEL_E2E_DATABASE_PORT:-15432}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulportal -plportal --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  liferay:
    environment:
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: org.mariadb.jdbc.Driver
      # allowPublicKeyRetrieval: MySQL 8's default caching_sha2_password
      # authentication over a non-TLS connection.
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:mariadb://database/lportal?useUnicode=true&characterEncoding=UTF-8&useFastDateParsing=false&allowPublicKeyRetrieval=true
