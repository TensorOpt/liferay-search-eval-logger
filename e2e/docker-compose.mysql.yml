#
# MySQL 8.4 with MySQL Connector/J, the setup Liferay documents for MySQL. The
# DXP image does not ship Connector/J; the harness downloads a pinned version
# into .work/ and checks its SHA-256 before the stack starts (stack.py).
#
# The URL is Liferay's MySQL template plus useCursorFetch=true. Without that
# flag Connector/J buffers a whole result set in the portal's heap, export
# included, however small the fetch size the plugin asks for.

services:

  database:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: lportal
      MYSQL_USER: lportal
      MYSQL_PASSWORD: lportal
      MYSQL_ROOT_PASSWORD: root
    command: ["--max-connections=200"]
    ports:
      - "127.0.0.1:${SEL_E2E_DATABASE_PORT:-15432}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: the entrypoint's temporary initialisation server
      # listens on the socket only, so this answers once the real one is up.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ulportal -plportal --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  liferay:
    environment:
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_DRIVER_UPPERCASEC_LASS_UPPERCASEN_AME: com.mysql.cj.jdbc.Driver
      LIFERAY_JDBC_PERIOD_DEFAULT_PERIOD_URL: jdbc:mysql://database/lportal?characterEncoding=UTF-8&dontTrackOpenResources=true&holdResultsOpenOverStatementClose=true&serverTimezone=GMT&useFastDateParsing=false&useUnicode=true&useCursorFetch=true
    volumes:
      - ./.work/mysql-connector-j.jar:/opt/liferay/tomcat/webapps/ROOT/WEB-INF/shielded-container-lib/mysql-connector-j.jar:ro
