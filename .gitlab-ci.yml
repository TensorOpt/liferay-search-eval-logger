# SPDX-License-Identifier: Apache-2.0
#
# GitLab is where this project's code and pipelines live; GitHub is a
# distribution channel. Every job runs a make target, so anything the pipeline
# does can be reproduced on a workstation with the same command.
#
# Branch and merge request pipelines: build (compile, unit tests, package),
# then the e2e suite on all four databases in parallel, against the build
# job's jars, ending with an install of the same jars as an .lpkg.
#
# Release: a manual job on main and on dxp-* branches, needing both the build
# and e2e stages to have passed first (`needs: [build, e2e]` on a job with a
# parallel matrix waits for every instance of it). It is `make publish`: the
# same local checks as `make release` plus `publish.py preflight`, then
# `publish.py publish` against the build job's own jars, already tested by
# the e2e stage - no rebuild, no retest, and so no dind service or Docker
# variables either. A developer releasing from a workstation instead runs
# `make release`, which re-checks, rebuilds and retests before publishing the
# same way. It needs GITHUB_TOKEN as a masked, protected CI/CD variable;
# GitLab uploads with the job token. A protected variable is only ever
# exposed to a pipeline on a protected branch, so main and every dxp-* branch
# must be protected in GitLab's branch settings, or the release job runs
# without GITHUB_TOKEN and fails.
#
# The e2e jobs run the portal under Docker-in-Docker, which needs the memory of
# a medium runner. SEL_RUNNER_TAG picks the runner; override it per project if
# your plan offers a different size, but note that scripts/install-tools.sh
# fetches amd64 binaries only, so a different runner needs its own tools step
# too.

workflow:
  rules:
    # A branch pipeline for a ref that also has an open merge request would
    # otherwise run twice (once as "push", once as "merge_request_event").
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  SEL_RUNNER_TAG: saas-linux-medium-amd64
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home

default:
  image: eclipse-temurin:21-jdk-jammy
  tags:
    - $SEL_RUNNER_TAG
  before_script:
    - scripts/install-tools.sh
  cache:
    key: gradle-$CI_COMMIT_REF_SLUG
    paths:
      - .gradle-home/caches/
      - .gradle-home/wrapper/

stages:
  - build
  - e2e
  - release

build:
  stage: build
  script:
    - make package
  artifacts:
    # 1 month, not the usual week: a manual release job can run long after
    # this one finishes, and still needs build/dist/ here to publish - the
    # release job keeps no artifacts of its own, so this is the only copy.
    expire_in: 1 month
    paths:
      - modules/*/build/libs/
      - build/dist/
      - build/e2e/
    reports:
      junit: modules/*/build/test-results/test/*.xml

e2e:
  stage: e2e
  needs: [build]
  services:
    - docker:27.3.1-dind
  variables:
    # Only the dind jobs need these: the harness talks to the dind service,
    # which is where published ports live, so the stack has to listen beyond
    # its loopback for that.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    SEL_E2E_HOST: docker
    SEL_E2E_BIND: 0.0.0.0
  timeout: 1h
  # No gradle cache here: --no-build means this job never invokes gradle.
  cache: []
  parallel:
    matrix:
      - DB: [postgres, mysql, mysql-mariadb-driver, mariadb]
  script:
    # The build job's jars and .lpkg, not a rebuild: the suite tests exactly
    # what the build stage produced. make e2e-run is the same target a
    # developer runs by hand, so this line is reproducible on a workstation.
    - make e2e-run DB="$DB"
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - e2e/results/
    reports:
      # A glob rather than $DB: GitLab does not expand job variables inside
      # `reports:` paths, so the literal variable name would never match.
      junit: e2e/results/*/junit.xml

release:
  stage: release
  # All four e2e matrix jobs must have passed, not just the build job: this
  # job must not be runnable off jars the e2e stage never finished checking.
  # No dind service and no DOCKER_*/SEL_E2E_* variables: `make publish` never
  # touches Docker, since it does not rebuild or retest.
  needs:
    - build
    - job: e2e
      artifacts: false
  # No gradle cache here either: make publish never invokes gradle.
  cache: []
  timeout: 30m
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^dxp-/
      when: manual
      allow_failure: true
  script:
    - make publish
  # No artifacts of its own: build/dist/ is the build job's artifact, kept
  # for a month there already, and this job changes nothing in it.
