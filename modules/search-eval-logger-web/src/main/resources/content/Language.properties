signup-banner-destination-note=Opens TensorOpt's website in a new tab. The link carries the date collection started and two tracking tags, nothing else.
restart-required=Restart required: this instance is not recording searches yet
restart-required-detail=Liferay binds its searcher once, when its search components start, so a plugin installed onto a running portal is not picked up until the next restart. Searches are being served normally and nothing is being recorded, whatever the configuration says. Restart the portal to begin collecting. This is expected once, after installation.
