dependencies {
	compileOnly group: "com.liferay.portal", name: "release.dxp.api"
	compileOnly project(":modules:search-eval-logger-api")

	// compileOnly keeps these out of the bundle, but unit tests still need
	// them on the classpath to run against.
	testImplementation group: "com.liferay.portal", name: "release.dxp.api"
	testImplementation project(":modules:search-eval-logger-api")

	// From 2025.Q3, LogFactoryUtil logs through log4j directly, which the
	// portal provides at runtime but release.dxp.api does not carry. Same
	// version as the target platform ships.
	testRuntimeOnly group: "org.apache.logging.log4j", name: "log4j-api", version: "2.17.1"
	testRuntimeOnly group: "org.apache.logging.log4j", name: "log4j-core", version: "2.17.1"
}
