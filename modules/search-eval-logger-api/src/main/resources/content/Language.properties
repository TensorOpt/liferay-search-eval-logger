search-eval-logger-configuration-name=Search Eval Logger

logging-enabled=Logging Enabled
logging-enabled-description=Collect search interaction records. Off on install; collection begins only when an administrator enables it here.

capture-depth=Capture Depth
capture-depth-description=Maximum hits recorded per search event. A ceiling, not a target: capture is limited to the hits the search already returned, and the query is never re-run to reach this number.

retention-days=Retention Window (Days)
retention-days-description=Events and hits older than this are deleted daily by the retention purge, as a set-based delete rather than in batches.

captured-field-names=Captured Fields
captured-field-names-description=Whitelist of hit fields to record. A field is captured only if the search response already contains it. Document bodies are not captured by default; adding a body field such as content captures it whenever the search response already carries it.

exclude-suggestion-traffic=Exclude Suggestion Traffic
exclude-suggestion-traffic-description=Drop search bar typeahead requests, which issue a query per keystroke threshold and would otherwise swamp user-submitted queries. While enabled, searches whose origin cannot be determined are also dropped.

admit-facet-only-searches=Admit Facet Only Searches
admit-facet-only-searches-description=Record keyword-free, facet-driven interactions. Off by default: they carry no query text to evaluate, and admitting them weakens the filter that keeps internal Liferay traffic out of the log.

cohort-salt-rotation-days=Cohort Salt Rotation (Days)
cohort-salt-rotation-days-description=How long a cohort hash stays linkable. Lengthen only if cohort groups prove too small to be useful.

require-web-request-context=Require Web Request Context
require-web-request-context-description=Admit only searches that carry an HTTP request, tightening the filter against internal traffic.

query-text-cap=Query Text Cap
query-text-cap-description=Characters of query text kept. Longer queries are truncated and flagged as truncated, never silently cut.

sampling-rate=Sampling Rate
sampling-rate-description=Fraction of admitted searches to record, between 0 and 1. An escape hatch for very high volume instances.

excluded-entry-class-names=Excluded Asset Types
excluded-entry-class-names-description=Searches constrained to these asset types are not recorded.

readiness-minimum-days=Readiness: Minimum Days
readiness-minimum-days-description=Days of collection required before this instance reports that its search log is ready to export. Counted from the first recorded event, not from the day logging was switched on. Keep this below the retention window: events older than that are deleted, so a longer period than the retention window can never be fully counted.

readiness-minimum-events=Readiness: Minimum Events
readiness-minimum-events-description=Recorded events required before this instance reports that its search log is ready to export. Only events still within the retention window count, because the rest have been deleted. Setting this higher than the retention window can hold means the report never appears.

show-evaluation-service-links=Show Evaluation Service Links
show-evaluation-service-links-description=Show the two optional links to the evaluation service on the Search Eval Export screen. They are ordinary links that do nothing until someone clicks them; this plugin never contacts the evaluation service on its own.

# The three notifications of DESIGN.md 3.6 (TO-112). Kept here, not in the
# web module's own content/Language.properties, because both the impl
# module's CollectionNotifier (the email path) and the web module's
# SearchEvalLoggerUserNotificationHandler (the website path) need the exact
# same text, impl cannot depend on web, and ResourceBundleUtil.getBundle
# resolves content/Language against whichever bundle the Class passed to it
# belongs to - so both modules read it from here by resolving against a
# class that lives in this one, api, which both already depend on.

notification-collection-started-title=Search logging is now collecting
notification-collection-started-body=This instance started collecting search interactions, confirming that the restart after installation worked. Open Search Eval Export to see admission counters and recent activity.

notification-readiness-title=Your search log is ready to export
notification-readiness-body=This instance has collected search interactions for long enough, and recorded enough of them, to be worth exporting. Open Search Eval Export to produce the archive.

notification-stall-title=Search logging is enabled but collecting nothing
notification-stall-body=Logging is switched on but nothing is being recorded, because Liferay's search components bound their searcher before this plugin was installed. Restart the portal to begin collecting.
