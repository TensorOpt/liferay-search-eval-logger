buildscript {
	dependencies {
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.workspace", version: "14.0.0"
	}

	repositories {
		mavenLocal()

		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "com.liferay.workspace"

// No "include" calls: the workspace plugin scans "liferay.workspace.modules.dir"
// and includes every subdirectory carrying a build file, so the modules of
// DESIGN.md 3.5 join the build as soon as their directory and build.gradle
// exist, which all four already do. Listing them here would instead declare
// an empty, unbuildable Gradle project for any future module whose directory
// has not landed yet.
